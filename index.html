<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#643823">
  <meta name="description" content="Berke & Guoda.">
  <title>Berke & Guoda</title>
  <script>try { if (localStorage.getItem('bg-scene') === 'blue-hour') document.documentElement.classList.add('is-blue-hour'); } catch {}</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23a74c2c'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia' font-weight='bold' font-size='44' fill='%23ffeed4'%3E%26%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #fff0d6; --orange: #dd9856; --yellow: #ffd786; }
    * { box-sizing: border-box; }
    html { font-size: 16px; }
    body { position: relative; margin: 0; min-height: 100vh; background: radial-gradient(ellipse 46% 42% at 83% 4%, #86a59c 0%, #b5ad86 45%, transparent 100%), radial-gradient(ellipse 57% 54% at 78% 68%, #e6a450 0%, #bd6e35 56%, transparent 100%), radial-gradient(ellipse 80% 48% at 24% 100%, #9d4f2b 0%, transparent 100%), linear-gradient(110deg, #4b2921 0%, #874328 56%, #ac6232 100%); color: var(--ink); font-family: 'Nunito', sans-serif; -webkit-font-smoothing: antialiased; }
    body::before { content: ''; position: fixed; inset: -80px; z-index: 0; background: url('assets/autumn-neighborhood.png') center / cover no-repeat; filter: blur(64px) saturate(.75); opacity: .16; pointer-events: none; transition: filter 1.1s ease, opacity 1.1s ease; }
    body::after { content: ''; position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse 54% 45% at 81% 10%, #607e92 0%, transparent 90%), linear-gradient(115deg, #253047, #4e4562 58%, #755138); opacity: 0; pointer-events: none; transition: opacity 1.1s ease; }
    .is-blue-hour body::before { filter: blur(64px) saturate(.65) brightness(.45) hue-rotate(17deg); opacity: .14; }
    .is-blue-hour body::after { opacity: .94; }
    ::selection { color: #522915; background: var(--yellow); }
    .page { position: relative; z-index: 1; width: min(calc(100% - 44px), 1600px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 90px; padding: 0 5px; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: 'Bree Serif', Georgia, serif; font-size: 23px; letter-spacing: -.04em; }
    .brand-badge { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: #d48543; color: #4d281b; box-shadow: 0 3px 0 #422216; font-family: 'Bree Serif', Georgia, serif; font-size: 26px; line-height: 1; padding-bottom: 3px; }
    .domain { font-size: 15px; font-weight: 800; letter-spacing: .015em; color: #fff0d6; text-shadow: 0 2px 9px #4b2921d9, 0 0 15px #4b2921d9; }
    .header-actions { display: flex; align-items: center; gap: 26px; }
    .film-link { color: #fff0d6; font-size: 15px; font-weight: 800; text-decoration-color: #ffd786; text-underline-offset: 6px; text-decoration-thickness: 2px; }
    .film-link:hover { color: var(--yellow); }
    .film-link:focus-visible { outline: 2px solid var(--yellow); outline-offset: 6px; border-radius: 2px; }
    main { padding: 0 0 30px; }
    .hero { position: relative; isolation: isolate; min-height: 710px; border: 1px solid #ffd9a968; border-radius: 20px; box-shadow: 0 22px 65px #321b1680; overflow: hidden; background: #97491f; }
    .hero::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, #142a4ca8 0%, #202d4c7d 48%, #171b33a3 100%); opacity: 0; pointer-events: none; transition: opacity 1.1s ease; }
    .hero::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, #3d201ac7 0%, #4f26127d 33%, transparent 72%), linear-gradient(0deg, #3d201a42, transparent 55%); pointer-events: none; }
    .hero img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; animation: image-enter 1.6s ease-out both; transition: filter 1.1s ease; }
    .is-blue-hour .hero img { filter: brightness(.82) saturate(.9) hue-rotate(9deg); }
    .is-blue-hour .hero::before { opacity: .66; }
    .night-lights, .night-stars { position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 1.3s ease; }
    .night-lights { background: radial-gradient(circle at 47% 46%, #ffd078b8 0%, #f4a94f5e 1.5%, transparent 8%), radial-gradient(circle at 78% 50%, #ffcc70a8 0%, #f4a94f50 1.5%, transparent 8%), radial-gradient(ellipse at 91% 59%, #ffc46792 0%, #e68f4342 7%, transparent 17%); mix-blend-mode: screen; }
    .night-stars { background: radial-gradient(circle at 63% 13%, #ffeed0 0 1px, transparent 2px), radial-gradient(circle at 71% 20%, #ffeed0 0 1px, transparent 2px), radial-gradient(circle at 80% 12%, #ffeed0 0 1px, transparent 2px), radial-gradient(circle at 87% 18%, #ffeed0 0 1px, transparent 2px), radial-gradient(circle at 76% 8%, #ffeed0 0 1px, transparent 2px); }
    .is-blue-hour .night-lights, .is-blue-hour .night-stars { opacity: 1; }
    .hero-content { position: relative; z-index: 3; display: flex; align-items: center; min-height: 708px; padding: 5%; }
    h1 { margin: 0; color: #fff5dc; font-family: 'Bree Serif', Georgia, serif; font-size: clamp(86px, 9vw, 155px); font-weight: 400; line-height: .95; letter-spacing: -.052em; text-shadow: 0 7px 17px #3a1a1a54; animation: title-enter .9s cubic-bezier(.22, 1, .36, 1) .08s both; }
    h1 .line { display: block; }
    h1 .amp { color: var(--yellow); font-size: .83em; line-height: 1; margin-left: 12px; }
    h1 .guoda { margin-left: 6px; }
    .star { position: absolute; z-index: 3; color: #ffdc8c; font-family: Georgia, serif; text-shadow: 0 2px 10px #79340d66; user-select: none; pointer-events: none; animation: twinkle 5s ease-in-out infinite; }
    .star-one { top: 12%; left: 9%; font-size: 28px; animation-delay: -.8s; }
    .star-two { top: 15%; right: 12%; font-size: 45px; animation-delay: -2.4s; }
    .star-three { bottom: 12%; right: 18%; font-size: 34px; animation-delay: -4.2s; }
    .star-four { bottom: 12%; left: 5%; font-size: 20px; animation-delay: -1.5s; }
    .falling { position: absolute; z-index: 4; top: -15%; pointer-events: none; user-select: none; width: 16px; height: 16px; border-radius: 75% 0 75% 0; background: #edaa5f; box-shadow: inset -3px -3px 0 #ae5d2b55; opacity: .84; transform: rotate(35deg); animation: fall linear infinite; }
    .falling.one { left: 15%; animation-duration: 13s; animation-delay: -7s; }
    .falling.two { left: 51%; width: 12px; height: 12px; background: #bf642e; animation-duration: 16s; animation-delay: -13s; }
    .falling.three { left: 82%; width: 20px; height: 20px; background: #f2b458; animation-duration: 19s; animation-delay: -2s; }
    .falling.four { left: 93%; width: 13px; height: 13px; background: #dc7e35; animation-duration: 17s; animation-delay: -9s; }
    .scene-toggle { position: absolute; right: 25px; bottom: 23px; z-index: 5; display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 8px 15px; border: 1px solid #ffe3adba; border-radius: 999px; background: #3d211cd9; box-shadow: 0 4px 18px #24140f70, inset 0 1px #fff6df30; color: #fff2d9; font: 800 13px 'Nunito', sans-serif; letter-spacing: .01em; cursor: pointer; backdrop-filter: blur(6px); transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
    .scene-toggle:hover { transform: translateY(-3px); background: #63321ef0; box-shadow: 0 8px 22px #24140f80; }
    .scene-toggle:active { transform: translateY(0); }
    .scene-toggle:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }
    .scene-icon { color: #ffdb8e; font-family: Georgia, serif; font-size: 20px; line-height: 1; }
    .is-blue-hour .scene-toggle { background: #202a43e8; border-color: #f8dca0c9; }
    .films { padding: 76px 12px 72px; scroll-margin-top: 24px; }
    .films-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid #ffe1ad8a; }
    .films h2 { margin: 0; color: #fff0d6; font-family: 'Bree Serif', Georgia, serif; font-size: clamp(36px, 4.2vw, 58px); font-weight: 400; line-height: 1.08; letter-spacing: -.035em; text-shadow: 0 3px 12px #4b29214d; }
    .films-mark { color: var(--yellow); font-family: Georgia, serif; font-size: 36px; line-height: 1; }
    .films-status { margin-top: 27px; padding: 46px 24px; border: 1px dashed #ffe0a88c; border-radius: 18px; background: #49291f42; color: #fff0d6; text-align: center; font-size: 17px; font-weight: 700; }
    .film-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1120px; margin: 28px auto 0; }
    .film-card { position: relative; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 25px; min-width: 0; padding: 12px; border: 1px solid #fff2d4; border-radius: 14px; background: linear-gradient(135deg, #faf0d8 0%, #f3dfb9 100%); color: #5d3425; box-shadow: 0 14px 35px #3b211b3d, inset 0 0 0 3px #fff8e148; }
    .ticket-seam { position: absolute; top: 16px; bottom: 16px; left: 175px; border-left: 1px dashed #a77c5c9c; pointer-events: none; }
    .film-poster, .poster-fallback { display: block; width: 150px; height: 225px; border-radius: 11px; background: #c69c72; }
    .film-poster { object-fit: cover; }
    .poster-fallback { display: grid; place-items: center; padding: 20px; color: #5d3425; text-align: center; font-weight: 800; }
    .film-info { display: flex; flex-direction: column; min-width: 0; padding: 9px 6px 5px 0; }
    .film-number { margin-bottom: 7px; color: #9a6745; font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .film-title { margin: 0; font-family: 'Bree Serif', Georgia, serif; font-size: 24px; font-weight: 400; line-height: 1.22; overflow-wrap: anywhere; }
    .film-year { margin: 3px 0 0; color: #7f5b46; font-size: 13px; font-weight: 700; }
    .film-ratings { margin-top: auto; }
    .rating-row { display: grid; grid-template-columns: 55px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 9px 0; border-top: 1px solid #a77c5c66; font-size: 14px; font-weight: 800; }
    .rating-stars { width: max-content; max-width: 100%; overflow: hidden; white-space: nowrap; font-family: Georgia, serif; font-size: 18px; letter-spacing: .03em; background: linear-gradient(90deg, #b75d2f var(--fill), #cbb9a1 var(--fill)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .rating-value { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .rating-pending { grid-column: 2 / 4; color: #866c59; font-size: 13px; font-weight: 700; }
    .film-source { max-width: 1120px; margin: 20px auto 0; color: #ffe5ba; font-size: 13px; font-weight: 700; text-align: right; }
    .film-source a { color: inherit; text-underline-offset: 4px; }
    .film-source a:hover { color: #fff8e8; }
    .film-source a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
    @keyframes image-enter { from { transform: scale(1.065); opacity: .82; } to { transform: scale(1); opacity: 1; } }
    @keyframes title-enter { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%, 100% { opacity: .48; transform: scale(.84) rotate(-7deg); } 50% { opacity: 1; transform: scale(1.14) rotate(7deg); } }
    @keyframes fall { from { translate: -20px -10px; rotate: 0deg; opacity: 0; } 10% { opacity: .9; } 85% { opacity: .8; } to { translate: 150px 850px; rotate: 540deg; opacity: 0; } }
    @media (min-width: 1600px) { .hero { min-height: 760px; } .hero-content { min-height: 758px; } }
    @media (max-width: 900px) { .page { width: calc(100% - 28px); } .hero { min-height: 620px; } .hero-content { min-height: 618px; padding: 7%; } .hero::after { background: linear-gradient(90deg, #3d201abf 0%, #4f26126b 55%, transparent 95%), linear-gradient(0deg, #3d201a50, transparent 60%); } h1 { font-size: clamp(74px, 12vw, 116px); } }
    @media (max-width: 1000px) { .film-grid { grid-template-columns: 1fr; max-width: 550px; gap: 16px; } }
    @media (max-width: 600px) { .page { width: calc(100% - 20px); } header { min-height: 76px; gap: 10px; padding: 0 7px; } .brand { gap: 8px; font-size: 18px; } .brand-badge { width: 35px; height: 35px; border-radius: 10px; font-size: 23px; box-shadow: 0 2px 0 #422216; } .domain { display: none; } .film-link { font-size: 14px; } main { padding-bottom: 20px; } .hero { min-height: 660px; border-radius: 17px; box-shadow: 0 14px 35px #321b166b; } .hero-content { min-height: 658px; align-items: flex-end; padding: 0 7% 73px; } .hero img { object-position: 57% center; } .hero::after { background: linear-gradient(0deg, #371c17d9 0%, #4a23195c 55%, transparent 88%); } h1 { font-size: clamp(61px, 18vw, 95px); line-height: .92; } h1 .amp { margin-left: 4px; } h1 .guoda { margin-left: 3px; } .star-one { top: 9%; left: 9%; } .star-two { top: 15%; right: 10%; } .star-three { bottom: 40%; right: 12%; } .star-four { bottom: 10%; left: 83%; } .films { padding: 57px 8px 32px; } .films-mark { font-size: 28px; } .film-card { grid-template-columns: 112px minmax(0, 1fr); gap: 13px; } .film-poster, .poster-fallback { width: 112px; height: 168px; } .film-info { padding: 2px 1px 0 0; } .film-title { font-size: 20px; } .rating-row { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 3px; padding: 6px 0; font-size: 12px; } .rating-stars { font-size: 15px; letter-spacing: 0; } .rating-pending { font-size: 12px; } }
    @media (max-width: 600px) { body::before { opacity: .10; } .night-lights { display: none; } .scene-toggle { right: 14px; bottom: 14px; padding: 8px 12px; font-size: 12px; } .film-source { margin-top: 16px; font-size: 12px; text-align: center; } .film-card { gap: 19px; } .ticket-seam { left: 130px; } .film-number { font-size: 10px; margin-bottom: 5px; } }
    @media (max-width: 380px) { .film-card { grid-template-columns: 90px minmax(0, 1fr); gap: 16px; } .ticket-seam { left: 105px; } .film-poster, .poster-fallback { width: 90px; height: 135px; } .film-title { font-size: 18px; } .rating-stars { font-size: 13px; } }
    @media (max-width: 359px) { .domain { font-size: 11px; } .brand { font-size: 16px; } h1 { font-size: 60px; } .hero-content { padding-left: 6%; padding-right: 6%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .falling { display: none; } .scene-toggle:hover, .scene-toggle:active { transform: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand" aria-label="Berke ve Guoda"><span class="brand-badge" aria-hidden="true">&</span><span>berke & guoda</span></div>
      <div class="header-actions"><a class="film-link" href="#filmler">Filmler</a><span class="domain">berkeandguoda.com</span></div>
    </header>
    <main>
      <section class="hero" aria-label="Berke ve Guoda">
        <img src="assets/autumn-neighborhood.png" alt="Gün batımında sonbahar yapraklarıyla çevrili, sıcak ışıklı bir mahalle sokağı illüstrasyonu." width="1942" height="809" fetchpriority="high">
        <div class="hero-content"><h1><span class="line">Berke</span><span class="line"><span class="amp">&</span><span class="guoda">Guoda</span></span></h1></div>
        <span class="star star-one" aria-hidden="true">✦</span><span class="star star-two" aria-hidden="true">✦</span><span class="star star-three" aria-hidden="true">✦</span><span class="star star-four" aria-hidden="true">✦</span>
        <span class="falling one" aria-hidden="true"></span><span class="falling two" aria-hidden="true"></span><span class="falling three" aria-hidden="true"></span><span class="falling four" aria-hidden="true"></span>
        <span class="night-lights" aria-hidden="true"></span><span class="night-stars" aria-hidden="true"></span>
        <button class="scene-toggle" type="button" aria-pressed="false"><span class="scene-icon" aria-hidden="true">☾</span><span class="scene-label">mavi saate geç</span></button>
      </section>
      <section class="films" id="filmler" aria-labelledby="films-title">
        <div class="films-heading"><h2 id="films-title">İzlediğimiz filmler</h2><span class="films-mark" aria-hidden="true">✦</span></div>
        <div id="film-list" aria-live="polite"><p class="films-status">Filmler yükleniyor…</p></div>
        <p class="film-source">Berke’nin film günlüğü: <a href="https://letterboxd.com/berkekuruoglu/" target="_blank" rel="noopener noreferrer">Letterboxd ↗</a></p>
      </section>
    </main>
  </div>
  <script>
    const sceneToggle = document.querySelector('.scene-toggle');
    const sceneIcon = document.querySelector('.scene-icon');
    const sceneLabel = document.querySelector('.scene-label');
    const themeColor = document.querySelector('meta[name="theme-color"]');
    function syncScene() {
      const blueHour = document.documentElement.classList.contains('is-blue-hour');
      sceneToggle.setAttribute('aria-pressed', String(blueHour));
      sceneIcon.textContent = blueHour ? '☀' : '☾';
      sceneLabel.textContent = blueHour ? 'gün batımına dön' : 'mavi saate geç';
      themeColor.content = blueHour ? '#202a43' : '#643823';
    }
    syncScene();
    sceneToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('is-blue-hour');
      const value = document.documentElement.classList.contains('is-blue-hour') ? 'blue-hour' : 'sunset';
      try { localStorage.setItem('bg-scene', value); } catch {}
      syncScene();
    });

    const filmList = document.getElementById('film-list');
    const ratingFormat = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 1 });

    function ratingRow(name, rating) {
      const row = document.createElement('div');
      row.className = 'rating-row';
      if (rating === null) {
        row.setAttribute('aria-label', `${name}: henüz puan yok`);
        const label = document.createElement('span');
        label.textContent = name;
        const pending = document.createElement('span');
        pending.className = 'rating-pending';
        pending.textContent = 'Henüz puan yok';
        row.append(label, pending);
        return row;
      }
      row.setAttribute('aria-label', `${name}: ${ratingFormat.format(rating)} / 5`);
      const label = document.createElement('span');
      label.textContent = name;
      const stars = document.createElement('span');
      stars.className = 'rating-stars';
      stars.setAttribute('aria-hidden', 'true');
      stars.style.setProperty('--fill', `${rating * 20}%`);
      stars.textContent = '★★★★★';
      const value = document.createElement('span');
      value.className = 'rating-value';
      value.textContent = `${ratingFormat.format(rating)}/5`;
      row.append(label, stars, value);
      return row;
    }

    function filmCard(film, index) {
      const card = document.createElement('article');
      card.className = 'film-card';
      const seam = document.createElement('span');
      seam.className = 'ticket-seam';
      seam.setAttribute('aria-hidden', 'true');
      const poster = document.createElement('img');
      poster.className = 'film-poster';
      poster.src = film.image;
      poster.alt = `${film.title} film afişi`;
      poster.loading = 'lazy';
      poster.width = 150;
      poster.height = 225;
      poster.addEventListener('error', () => {
        const fallback = document.createElement('div');
        fallback.className = 'poster-fallback';
        fallback.textContent = film.title;
        poster.replaceWith(fallback);
      }, { once: true });
      const info = document.createElement('div');
      info.className = 'film-info';
      const number = document.createElement('span');
      number.className = 'film-number';
      number.textContent = `kayıt ${String(index + 1).padStart(2, '0')}`;
      const title = document.createElement('h3');
      title.className = 'film-title';
      title.textContent = film.title;
      info.append(number, title);
      if (film.year) {
        const year = document.createElement('p');
        year.className = 'film-year';
        year.textContent = film.year;
        info.append(year);
      }
      const ratings = document.createElement('div');
      ratings.className = 'film-ratings';
      ratings.append(ratingRow('Berke', film.berkeRating), ratingRow('Guoda', film.guodaRating));
      info.append(ratings);
      card.append(poster, seam, info);
      return card;
    }

    async function loadFilms() {
      try {
        const response = await fetch('movies.json');
        if (!response.ok) throw new Error('Film listesi alınamadı');
        const films = await response.json();
        if (!Array.isArray(films) || films.some(film => !film.title || !film.image || !Number.isFinite(film.berkeRating) || film.berkeRating < 0 || film.berkeRating > 5 || (film.guodaRating !== null && (!Number.isFinite(film.guodaRating) || film.guodaRating < 0 || film.guodaRating > 5)))) throw new Error('Film listesi geçersiz');
        if (films.length === 0) {
          filmList.innerHTML = '<p class="films-status">Henüz film eklemedik.</p>';
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'film-grid';
        grid.append(...films.map(filmCard));
        filmList.replaceChildren(grid);
      } catch {
        filmList.innerHTML = '<p class="films-status">Filmler şu anda yüklenemiyor.</p>';
      }
    }

    loadFilms();
  </script>
</body>
</html>
