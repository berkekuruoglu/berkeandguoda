<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241f1a">
  <meta name="description" content="Berke & Guoda.">
  <title>Berke & Guoda</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23241f1a'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='44' fill='%23d98d50'%3E%26%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --paper: #241f1a; --ink: #f0e3cf; --muted: #c5b5a2; --line: #f0e3cf30; --accent: #d98d50; }
    * { box-sizing: border-box; }
    html { font-size: 16px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--accent); color: var(--paper); }
    .page { width: min(100% - 112px, 1440px); margin: auto; }
    header { min-height: 100px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); gap: 24px; }
    .wordmark { font-size: 18px; font-weight: 600; letter-spacing: -.04em; }
    .wordmark span { color: var(--accent); margin: 0 3px; }
    .domain { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--muted); }
    main { padding-top: 40px; }
    .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 39px; }
    h1 { margin: 0; font-size: clamp(76px, 9.5vw, 147px); font-weight: 500; letter-spacing: -.075em; line-height: 1.08; }
    h1 > .last-name { color: var(--ink); }
    h1 .ampersand { color: var(--accent); font-size: .76em; font-weight: 400; letter-spacing: -.07em; padding: 0 .025em; }
    .accent-rule { height: 7px; width: 60px; background: var(--accent); flex-shrink: 0; margin-bottom: 13px; }
    .photo { margin: 0; position: relative; border-left: 9px solid var(--accent); }
    .photo img { display: block; width: 100%; height: clamp(380px, 38vw, 565px); object-fit: cover; object-position: 50% 57%; }
    .bottom { min-height: 92px; display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); }
    .signature { font-size: 14px; font-weight: 500; color: var(--muted); }
    .photo-credit { color: var(--muted); font-size: 12px; text-underline-offset: 4px; text-decoration-color: #c5b5a266; line-height: 1.5; }
    .photo-credit:hover { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
    footer { height: 32px; }
    @media (min-width: 1650px) { .photo img { height: 590px; } }
    @media (max-width: 1050px) { .page { width: calc(100% - 64px); } header { min-height: 88px; } main { padding-top: 34px; } .masthead { padding-bottom: 32px; } h1 { font-size: clamp(60px, 9.4vw, 110px); } .accent-rule { width: 36px; height: 5px; margin-bottom: 8px; } .photo img { height: 475px; } }
    @media (max-width: 700px) { .page { width: calc(100% - 40px); } header { min-height: 82px; gap: 12px; } .wordmark { font-size: 16px; } .domain { font-size: 12px; } main { padding-top: 31px; } .masthead { padding-bottom: 30px; } h1 { font-size: clamp(64px, 18.7vw, 126px); line-height: .99; letter-spacing: -.07em; } h1 .last-name { display: block; margin-top: 8px; } h1 .ampersand { font-size: .72em; padding-right: .1em; } .accent-rule { display: none; } .photo { border-left-width: 5px; } .photo img { height: auto; aspect-ratio: 4 / 5; object-position: 50% 50%; } .bottom { min-height: 88px; gap: 14px; align-items: center; } .signature { font-size: 14px; } .photo-credit { font-size: 12px; max-width: 150px; text-align: right; } footer { height: 22px; } }
    @media (max-width: 359px) { header { align-items: flex-start; justify-content: center; flex-direction: column; gap: 5px; padding: 15px 0; } h1 { font-size: 65px; } .photo-credit { max-width: 130px; } }
    @media (prefers-reduced-motion: no-preference) { main { animation: appear .55s ease-out both; } @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="wordmark" aria-label="Berke ve Guoda">berke<span>&</span>guoda</div>
      <span class="domain">berkeandguoda.com</span>
    </header>
    <main>
      <div class="masthead">
        <h1 aria-label="Berke ve Guoda">Berke <span class="last-name"><span class="ampersand" aria-hidden="true">&</span> Guoda</span></h1>
        <div class="accent-rule" aria-hidden="true"></div>
      </div>
      <figure class="photo">
        <img src="assets/autumn.jpg" alt="Altın sarısı ve bakır rengi yapraklarla çevrili, sonbahar ışığındaki bir orman yolu." width="2200" height="1467" fetchpriority="high">
      </figure>
      <div class="bottom">
        <span class="signature">Berke & Guoda</span>
        <a class="photo-credit" href="https://unsplash.com/photos/ATxg6Ofkf4M" target="_blank" rel="noopener noreferrer">Fotoğraf: Markus Spiske / Unsplash</a>
      </div>
    </main>
    <footer></footer>
  </div>
</body>
</html>
